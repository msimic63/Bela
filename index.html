<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#071640"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bela"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title>Bela – Brojanje</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --g1: #071640; --g2: #0a2d6e; --g3: #0f4393; --g4: #1254a8;
    --gold: #4a90d9; --gold2: #7ec8f7;
    --red: #e74c3c; --white: #ffffff; --dim: rgba(255,255,255,0.50);
    --border: rgba(100,160,220,0.35);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; width: 100%; background: var(--g1); font-family: 'Inter', sans-serif; color: var(--white); -webkit-tap-highlight-color: transparent; overflow: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px),
                      repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
  }
  .app { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: flex; flex-direction: column; width: 100%; }

  /* Header */
  .header { padding: calc(10px + var(--safe-top)) 50px 8px; text-align: center; flex-shrink: 0; border-bottom: 1px solid var(--border); background: linear-gradient(180deg,rgba(0,0,0,0.35) 0%,transparent 100%); position: relative; }
  .header h1 { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 900; color: var(--gold2); letter-spacing: 4px; text-transform: uppercase; white-space: nowrap; }
  .header-sub { font-size: 11px; color: var(--dim); letter-spacing: 2px; margin-top: 3px; }
  .reset-btn { position: absolute; top: calc(10px + var(--safe-top)); right: 10px; background: none; border: none; color: rgba(255,255,255,0.25); font-size: 20px; cursor: pointer; }
  .reset-btn:active { color: var(--red); }

  /* Scoreboard */
  .scoreboard { display: grid; grid-template-columns: 1fr 36px 1fr; align-items: center; padding: 10px 14px 8px; gap: 8px; flex-shrink: 0; }
  .team-card { background: linear-gradient(145deg, var(--g2), var(--g3)); border: 1.5px solid var(--border); border-radius: 16px; padding: 10px 8px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.35); transition: border-color 0.3s, box-shadow 0.3s; }
  .team-card.leading { border-color: var(--gold); box-shadow: 0 0 24px rgba(74,144,217,0.35); }
  .team-card.winner { border-color: #2ecc71; box-shadow: 0 0 30px rgba(46,204,113,0.3); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 30px rgba(46,204,113,0.3)} 50%{box-shadow:0 0 50px rgba(46,204,113,0.5)} }
  .team-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--gold2); background: none; border: none; outline: none; text-align: center; width: 100%; cursor: pointer; border-bottom: 1px dashed rgba(100,160,220,0.3); padding-bottom: 4px; margin-bottom: 6px; }
  .team-total { font-family: 'Syne', sans-serif; font-size: 38px; font-weight: 900; color: var(--gold2); line-height: 1; }
  .team-total.leading { color: var(--gold2); }
  .progress-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 99px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold2); border-radius: 99px; transition: width 0.4s; }
  .vs { font-family: 'Syne', sans-serif; font-size: 15px; color: var(--gold); opacity: 0.6; text-align: center; }

  /* Round entry */
  .round-entry { padding: 8px 14px; flex-shrink: 0; border-bottom: 1px solid var(--border); }

  /* Igra selector */
  .igra-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .igra-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .igra-adj { width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--border); background: rgba(0,0,0,0.2); color: var(--white); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .igra-adj:active { background: rgba(100,160,220,0.2); }
  .igra-val { flex: 1; padding: 8px; border-radius: 12px; border: 1.5px solid rgba(100,160,220,0.5); background: rgba(0,0,0,0.25); color: var(--gold2); font-size: 20px; font-weight: 800; font-family: 'Syne', sans-serif; text-align: center; outline: none; color-scheme: dark; }
  .igra-val.invalid { border-color: var(--red); color: var(--red); }

  /* bodovi row */
  .entry-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .entry-group label { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; padding-left: 2px; }
  .entry-group input { width: 100%; padding: 10px 8px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.25); color: var(--white); font-size: 22px; font-weight: 700; font-family: 'Inter', sans-serif; outline: none; text-align: center; color-scheme: dark; transition: border-color 0.15s; }
  .entry-group input:focus { border-color: var(--gold); }
  .entry-group input.invalid { border-color: var(--red); }

  /* PAD buttons */
  .pad-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
  .pad-btn { min-width: 0; padding: 9px 2px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: var(--dim); font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 0.3px; transition: all 0.15s; white-space: nowrap; }
  .pad-btn.active { border-color: var(--red); background: rgba(231,76,60,0.2); color: #ff6b6b; }
  .pad-btn.stig.active { border-color: #ff9500; background: rgba(255,149,0,0.18); color: #ffb347; }

  /* Action buttons */
  .btn-primary { width: 100%; padding: 12px; border-radius: 14px; border: none; background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 4px 14px rgba(21,101,192,0.4); transition: transform 0.1s, opacity 0.1s; margin-bottom: 6px; }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
  .btn-secondary { width: 100%; padding: 12px; border-radius: 14px; border: none; background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 4px 14px rgba(21,101,192,0.4); transition: transform 0.1s, opacity 0.1s; margin-bottom: 6px; }
  .btn-secondary:active { transform: scale(0.97); opacity: 0.9; }

  /* Mic */
  .mic-btn { width: 100%; padding: 10px; border-radius: 14px; border: 1.5px solid rgba(100,160,220,0.4); background: rgba(0,0,0,0.2); color: var(--dim); font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; transition: all 0.2s; }
  .mic-btn.listening { border-color: var(--red); background: rgba(231,76,60,0.15); color: #ff6b6b; animation: micPulse 1s infinite; }
  @keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0.4)} 50%{box-shadow:0 0 0 8px rgba(231,76,60,0)} }

  /* History */
  .history { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 14px calc(8px + var(--safe-bottom)); }
  .paper-table { width: 100%; border-collapse: collapse; font-family: 'Syne', sans-serif; }
  .paper-table thead th { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); padding: 4px 4px 8px; border-bottom: 2px solid var(--border); text-align: center; }
  .paper-table thead th:first-child { text-align: left; width: 24px; }
  .paper-table thead th.igra-col { font-size: 9px; color: rgba(255,255,255,0.3); }
  .paper-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.06); animation: fadeIn 0.3s ease; }
  .paper-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  .paper-table td { padding: 5px 4px; text-align: center; vertical-align: middle; }
  .paper-table td:first-child { font-size: 11px; color: var(--dim); text-align: left; }
  .r-round { font-size: 12px; color: rgba(255,255,255,0.35); display: block; }
  .r-total { font-size: 22px; font-weight: 800; display: block; line-height: 1; }
  .r-total.win { color: var(--gold2); }
  .r-total.lose { color: rgba(255,255,255,0.55); }
  .r-total.pad { color: var(--red); font-size: 14px; font-style: italic; }
  .r-total.stiglje { color: #ff9500; font-size: 14px; font-style: italic; }
  .del-btn { background: none; border: none; color: rgba(255,255,255,0.2); font-size: 15px; cursor: pointer; padding: 0 2px; }
  .del-btn:active { color: var(--red); }
  .empty-msg { text-align: center; color: var(--dim); font-size: 13px; padding: 24px; }

  /* Toast */
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(15,67,147,0.96); border: 1px solid var(--border); border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: 600; color: var(--white); z-index: 200; transition: transform 0.3s; white-space: nowrap; max-width: 90vw; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Winner overlay */
  .winner-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 32px; }
  .winner-overlay.show { display: flex; }
  .winner-emoji { font-size: 64px; margin-bottom: 12px; animation: bounce 0.6s infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-12px)} }
  .winner-title { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 900; color: var(--gold2); margin-bottom: 8px; }
  .winner-score { font-size: 20px; color: var(--white); margin-bottom: 6px; }
  .winner-sub { font-size: 14px; color: var(--dim); margin-bottom: 32px; }
  .new-game-btn { padding: 16px 48px; border-radius: 16px; border: none; background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; font-size: 17px; font-weight: 800; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }

  /* Dijalog potvrde */
  .dialog-overlay { position: fixed; inset: 0; z-index: 150; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(3,10,32,0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; }
  .dialog-overlay.show { opacity: 1; visibility: visible; }
  .dialog { width: 100%; max-width: 340px; background: linear-gradient(160deg, var(--g2), var(--g3)); border: 1.5px solid rgba(100,160,220,0.5); border-radius: 22px; padding: 24px 20px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6); transform: translateY(16px) scale(0.94); transition: transform 0.25s cubic-bezier(.2,.9,.3,1.2); }
  .dialog-overlay.show .dialog { transform: none; }
  .dialog-icon { width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; background: rgba(231,76,60,0.15); border: 1.5px solid rgba(231,76,60,0.5); }
  .dialog-title { font-family: 'Syne', sans-serif; font-size: 21px; font-weight: 900; color: var(--white); margin-bottom: 8px; }
  .dialog-text { font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.7); margin-bottom: 14px; }
  .dialog-score { display: none; align-items: center; justify-content: center; gap: 10px; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-bottom: 16px; font-family: 'Syne', sans-serif; }
  .dialog-score.show { display: flex; }
  .dialog-score .ds-name { font-size: 12px; font-weight: 700; color: var(--dim); max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dialog-score .ds-val { font-size: 22px; font-weight: 900; color: var(--gold2); }
  .dialog-score .ds-sep { color: var(--dim); font-weight: 700; }
  .dialog-actions { display: flex; flex-direction: column; gap: 8px; }
  .dialog-btn { width: 100%; padding: 13px; border-radius: 14px; font-size: 15px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: transform 0.1s, opacity 0.1s; font-family: 'Inter', sans-serif; }
  .dialog-btn:active { transform: scale(0.97); opacity: 0.9; }
  .dialog-btn.stay { border: none; background: linear-gradient(135deg, #1e7be0, #0d47a1); color: #fff; box-shadow: 0 4px 14px rgba(21,101,192,0.45); }
  .dialog-btn.go { border: 1.5px solid rgba(231,76,60,0.55); background: rgba(231,76,60,0.12); color: #ff7b6e; }

  .header-title-row{display:flex;align-items:center;justify-content:center;gap:14px;}
  .header-wins-row{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;}
  .win-card{background:linear-gradient(145deg,var(--g2),var(--g3));border:1.5px solid rgba(100,160,220,.5);border-radius:14px;padding:6px 14px;text-align:center;min-width:60px;flex-shrink:0;}
  .win-card-val{font-family:'Syne',sans-serif;font-size:38px;font-weight:900;color:#f5c518;line-height:1;}
</style>
</head>
<body>
<div class="app">
  <button class="reset-btn" onclick="confirmReset()" title="Nova igra">↺</button>

  <div class="header">
    <div class="header-wins-row">
      <div class="win-card"><div class="win-card-val" id="wins-mi">0</div></div>
      <div>
        <h1>♠ Bela ♥</h1>
        <div class="header-sub">Igra se do 1001</div>
      </div>
      <div class="win-card"><div class="win-card-val" id="wins-vi">0</div></div>
    </div>
  </div>

  <div class="scoreboard">
    <div class="team-card" id="card-mi">
      <input class="team-name" id="name-mi" value="Mi" maxlength="10"/>
      <div class="team-total" id="total-mi">0</div>
      <div class="progress-bar"><div class="progress-fill" id="prog-mi" style="width:0%"></div></div>
    </div>
    <div class="vs">VS</div>
    <div class="team-card" id="card-vi">
      <input class="team-name" id="name-vi" value="Vi" maxlength="10"/>
      <div class="team-total" id="total-vi">0</div>
      <div class="progress-bar"><div class="progress-fill" id="prog-vi" style="width:0%"></div></div>
    </div>
  </div>

  <div class="round-entry">
    <!-- Igra ukupno -->
    <div class="igra-wrap">
      <span class="igra-label">Igra</span>
      <button class="igra-adj" onclick="adjIgra(-1)">‹</button>
      <input type="number" id="igra-input" class="igra-val" value="162" inputmode="numeric" onfocus="this.select()" onchange="onIgraChange(this)"/>
      <button class="igra-adj" onclick="adjIgra(1)">›</button>
    </div>

    <!-- Mi / Vi bodovi -->
    <div class="entry-row">
      <div class="entry-group">
        <label id="lbl-mi">Mi bodovi</label>
        <input type="number" id="pts-mi" placeholder="—" min="0" inputmode="numeric" oninput="onPtsInput('mi')" onblur="validatePts('mi')" onkeyup="blockBadPts('mi')"/>
      </div>
      <div class="entry-group">
        <label id="lbl-vi">Vi bodovi</label>
        <input type="number" id="pts-vi" placeholder="—" min="0" inputmode="numeric" oninput="onPtsInput('vi')" onblur="validatePts('vi')" onkeyup="blockBadPts('vi')"/>
      </div>
    </div>

    <!-- PAD -->
    <div class="pad-row">
      <button class="pad-btn" id="pad-mi" onclick="togglePad('mi')">PAD</button>
      <button class="pad-btn stig" id="stig-mi" onclick="toggleStig('mi')">ŠTIGLJE</button>
      <button class="pad-btn" id="pad-vi" onclick="togglePad('vi')">PAD</button>
      <button class="pad-btn stig" id="stig-vi" onclick="toggleStig('vi')">ŠTIGLJE</button>
    </div>

    <button class="btn-primary" onclick="addRound()">POTVRDI</button>
    <button class="mic-btn" id="mic-btn" onclick="toggleVoice()">🎤 GLASOVNI UNOS</button>
  </div>

  <div class="history">
    <table class="paper-table">
      <thead>
        <tr>
          <th>#</th>
          <th id="hdr-mi">Mi</th>
          <th id="hdr-vi">Vi</th>
          <th class="igra-col">Igra</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="history-list">
        <tr><td colspan="5"><div class="empty-msg">Još nema upisanih rundi ♠</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="dialog-overlay" id="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="dialog">
    <div class="dialog-icon" id="dialog-icon">🚪</div>
    <div class="dialog-title" id="dialog-title"></div>
    <div class="dialog-text" id="dialog-text"></div>
    <div class="dialog-score" id="dialog-score">
      <span class="ds-name" id="ds-name-mi"></span><span class="ds-val" id="ds-val-mi"></span>
      <span class="ds-sep">:</span>
      <span class="ds-val" id="ds-val-vi"></span><span class="ds-name" id="ds-name-vi"></span>
    </div>
    <div class="dialog-actions">
      <button class="dialog-btn stay" id="dialog-cancel"></button>
      <button class="dialog-btn go" id="dialog-ok"></button>
    </div>
  </div>
</div>

<div class="winner-overlay" id="winner-overlay">
  <div class="winner-emoji">🏆</div>
  <div class="winner-title" id="winner-name"></div>
  <div class="winner-score" id="winner-score"></div>
  <div class="winner-sub">Čestitamo!</div>
  <button class="new-game-btn" onclick="newGame()">Nova igra</button>
</div>

<script>
// ── Valid igra values (whitelist) ──────────
const VALID_IGRA = [162,182,202,212,222,232,242,252,262,272,282,292,302,312,322,332,342,352,362,372,382,392,402,412,422,432,442,452,462,472,482,492,502,512,522,532,542,552,562,572,582,592,602,612,622,632,642,652,662,672,682,692,702,712,722,732,742,752,762,772,802,822];

// ── IndexedDB ──────────────────────────────
const DB_NAME = "bela_db2", DB_STORE = "state", DB_KEY = "main";
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = () => rej();
  });
}
function dbSave(s) {
  if (!db) return;
  db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).put({...s}, DB_KEY);
}
function dbLoad() {
  return new Promise(res => {
    if (!db) { res(null); return; }
    const r = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(DB_KEY);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => res(null);
  });
}

// ── State ──────────────────────────────────
let state = {
  nameA: "Mi", nameB: "Vi",
  totalA: 0, totalB: 0,
  rounds: [],
  pad: { mi: false, vi: false }
};

// ── Toast ──────────────────────────────────
function showToast(msg, dur = 2500) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), dur);
}

// ── Igra controls ──────────────────────────
function getIgra() { return parseInt(document.getElementById("igra-input").value) || 162; }

function adjIgra(dir) {
  const cur = getIgra();
  const idx = VALID_IGRA.indexOf(cur);
  let next;
  if (idx === -1) {
    next = dir > 0 ? VALID_IGRA.find(v => v > cur) : [...VALID_IGRA].reverse().find(v => v < cur);
  } else {
    next = VALID_IGRA[Math.max(0, Math.min(VALID_IGRA.length - 1, idx + dir))];
  }
  if (next && stigOn() && next < STIG_MIN) { showToast("⚠️ Kod štiglje igra je najmanje " + STIG_MIN + "!"); return; }
  if (next) {
    document.getElementById("igra-input").value = next;
    document.getElementById("igra-input").classList.remove("invalid");
    // recalc other pts field if one is filled
    recalcOtherPts();
  }
}

function onIgraChange(el) {
  if (!el) el = document.getElementById("igra-input");
  const v = parseInt(el.value) || 0;
  if (!v || !VALID_IGRA.includes(v)) {
    el.classList.add("invalid");
    const msg = v ? "Igra ne može imati " + v + " bod" + (v === 1 ? "" : "ova") + "! Valjane vrijednosti: 162, 182, 202..." : "Upiši vrijednost igre!";
    showToast("⚠️ " + msg);
    el.value = "";
    setTimeout(() => el.focus(), 50);
  } else if (stigOn() && v < STIG_MIN) {
    showToast("⚠️ Kod štiglje igra je najmanje " + STIG_MIN + "!");
    el.value = STIG_MIN;
    el.classList.remove("invalid");
  } else {
    el.classList.remove("invalid");
    recalcOtherPts();
  }
}

function recalcOtherPts() {
  const igra = getIgra();
  const mi = document.getElementById("pts-mi");
  const vi = document.getElementById("pts-vi");
  if (mi.value !== "" && vi.value === "") {
    const v = parseInt(mi.value);
    if (!isNaN(v)) vi.value = igra - v;
  } else if (vi.value !== "" && mi.value === "") {
    const v = parseInt(vi.value);
    if (!isNaN(v)) mi.value = igra - v;
  }
}

function blockBadPts(team) {
  const igra = getIgra();
  const el = document.getElementById("pts-" + team);
  if (el.value === "") return;
  const v = parseInt(el.value);
  if (!isNaN(v) && v > igra) {
    showToast("⚠️ Max " + igra + " bodova!");
    el.value = el.value.slice(0, -1); // remove last char
  }
}

function onPtsInput(team) {
  const igra = getIgra();
  const el = document.getElementById("pts-" + team);
  const other = document.getElementById("pts-" + (team === "mi" ? "vi" : "mi"));
  if (el.value === "") { other.value = ""; el.classList.remove("invalid"); return; }
  const v = parseInt(el.value);
  if (isNaN(v) || v < 0) { el.classList.add("invalid"); return; }
  // Minimum valid pts is 0 (štiglje) or 2+ — 1 is impossible in bela
  if (v === 1) {
    el.classList.add("invalid");
    showToast("⚠️ Nemoguć broj! Minimalni bodovi su 2 (ili 0 za štiglje).");
    return;
  }
  if (v > igra) {
    el.classList.add("invalid");
    showToast("⚠️ Bodovi " + v + " ne mogu biti veći od igre (" + igra + ")!");
    return;
  }
  el.classList.remove("invalid");
  other.value = igra - v;
  other.classList.remove("invalid");
}

// ── PAD ────────────────────────────────────
const STIG_MIN = 252;
let stig = { mi: false, vi: false };
function stigOn() { return stig.mi || stig.vi; }
function syncSel() {
  ["mi", "vi"].forEach(t => {
    document.getElementById("pad-" + t).classList.toggle("active", state.pad[t]);
    document.getElementById("stig-" + t).classList.toggle("active", stig[t]);
  });
}
function clearSel() {
  state.pad = { mi: false, vi: false };
  stig = { mi: false, vi: false };
  syncSel();
}
// Odabir je uvijek samo jedan od četiri (PAD/ŠTIGLJE × Mi/Vi)
function togglePad(team) {
  const on = !state.pad[team];
  clearSel();
  state.pad[team] = on;
  syncSel();
}
function toggleStig(team) {
  const on = !stig[team];
  clearSel();
  stig[team] = on;
  if (on) {
    const inp = document.getElementById("igra-input");
    if (getIgra() < STIG_MIN) {
      inp.value = STIG_MIN;
      showToast("🟠 Štiglje – igra postavljena na " + STIG_MIN);
    }
    inp.classList.remove("invalid");
    ["pts-mi", "pts-vi"].forEach(id => { const e = document.getElementById(id); e.value = ""; e.classList.remove("invalid"); });
  }
  syncSel();
}

// ── Add round ──────────────────────────────
function validatePts(team) {
  const igra = getIgra(), el = document.getElementById("pts-" + team);
  if (el.value === "") return;
  const v = parseInt(el.value);
  if (isNaN(v) || v < 0) {
    el.classList.add("invalid");
    showToast("⚠️ Neispravan broj bodova!");
    el.value = ""; setTimeout(() => el.focus(), 50); return;
  }
  if (v === 1) {
    el.classList.add("invalid");
    showToast("⚠️ Nemoguć broj! Minimalni bodovi su 2 (ili 0 za štiglje).");
    el.value = ""; setTimeout(() => el.focus(), 50); return;
  }
  if (v > igra) {
    el.classList.add("invalid");
    showToast("⚠️ Bodovi " + v + " ne mogu biti veći od igre (" + igra + ")!");
    el.value = ""; setTimeout(() => el.focus(), 50); return;
  }
  el.classList.remove("invalid");
}

function addRound() {
  const igra = getIgra();
  if (!VALID_IGRA.includes(igra)) { showToast("⚠️ Ispravi vrijednost igre!", 3000); return; }

  let addA, addB;
  const padMi = state.pad.mi, padVi = state.pad.vi;

  if (padMi) {
    // Mi pad — sve ide Vi
    addA = 0; addB = igra;
  } else if (padVi) {
    // Vi pad — sve ide Mi
    addA = igra; addB = 0;
  } else if (stigOn()) {
    // Štiglje — ekipa bez štiha dobiva 0, sve ide drugoj; igra najmanje 252
    if (igra < STIG_MIN) { showToast("⚠️ Kod štiglje igra je najmanje " + STIG_MIN + "!", 3000); return; }
    addA = stig.mi ? 0 : igra; addB = stig.mi ? igra : 0;
  } else {
    const ptsA = parseInt(document.getElementById("pts-mi").value);
    const ptsB = parseInt(document.getElementById("pts-vi").value);
    if (isNaN(ptsA) || isNaN(ptsB)) { showToast("⚠️ Upiši bodove za oba tima!", 3000); return; }
    if (ptsA + ptsB !== igra) { showToast(`⚠️ Bodovi moraju biti ${igra} ukupno! (${ptsA}+${ptsB}=${ptsA+ptsB})`, 3500); return; }
    if (ptsA < 0 || ptsB < 0) { showToast("⚠️ Bodovi ne mogu biti negativni!", 3000); return; }
    if (ptsA === 1 || ptsB === 1) { showToast("⚠️ Nemoguć broj! Minimalni bodovi su 2 (ili 0 za štiglje)."); return; }
    // If one team has 0 (štiglje), other must have at least 252
    if (ptsA === 0 && ptsB < 252) { showToast("⚠️ Ako " + state.nameA + " ima štiglje, " + state.nameB + " mora imati najmanje 252 boda!"); return; }
    if (ptsB === 0 && ptsA < 252) { showToast("⚠️ Ako " + state.nameB + " ima štiglje, " + state.nameA + " mora imati najmanje 252 boda!"); return; }
    addA = ptsA; addB = ptsB;
  }

  state.rounds.push({ igra, addA, addB, padMi, padVi });
  state.totalA += addA;
  state.totalB += addB;

  // reset
  document.getElementById("pts-mi").value = "";
  document.getElementById("pts-vi").value = "";
  document.getElementById("pts-mi").classList.remove("invalid");
  document.getElementById("pts-vi").classList.remove("invalid");
  document.getElementById("igra-input").value = 162;
  document.getElementById("igra-input").classList.remove("invalid");
  clearSel();

  dbSave(state);
  render();
  checkWinner();
}

function undoRound() {
  if (state.rounds.length === 0) { showToast("Nema rundi za poništiti"); return; }
  const r = state.rounds.pop();
  state.totalA -= r.addA;
  state.totalB -= r.addB;
  dbSave(state);
  render();
  showToast("🗑️ Zadnja runda poništena");
}

function deleteRound(idx) {
  // recalc totals from scratch
  state.rounds.splice(idx, 1);
  state.totalA = state.rounds.reduce((s, r) => s + r.addA, 0);
  state.totalB = state.rounds.reduce((s, r) => s + r.addB, 0);
  dbSave(state);
  render();
}

// ── Render ─────────────────────────────────
function render() {
  const tA = state.totalA, tB = state.totalB;
  document.getElementById("total-mi").textContent = tA;
  document.getElementById("total-vi").textContent = tB;
  document.getElementById("total-mi").className = "team-total" + (tA > tB ? " leading" : "");
  document.getElementById("total-vi").className = "team-total" + (tB > tA ? " leading" : "");
  document.getElementById("card-mi").className = "team-card" + (tA > tB ? " leading" : "");
  document.getElementById("card-vi").className = "team-card" + (tB > tA ? " leading" : "");
  document.getElementById("prog-mi").style.width = Math.min(100, (tA / 1001) * 100) + "%";
  document.getElementById("prog-vi").style.width = Math.min(100, (tB / 1001) * 100) + "%";

  // Wins counter
  const wA = state.winsA || 0, wB = state.winsB || 0;
  const eWA = document.getElementById("wins-mi"), eWB = document.getElementById("wins-vi");
  if (eWA) eWA.textContent = wA;
  if (eWB) eWB.textContent = wB;

  const nA = state.nameA, nB = state.nameB;
  document.getElementById("name-mi").value = nA;
  document.getElementById("name-vi").value = nB;
  document.getElementById("lbl-mi").textContent = nA + " bodovi";
  document.getElementById("lbl-vi").textContent = nB + " bodovi";
  document.getElementById("hdr-mi").textContent = nA;
  document.getElementById("hdr-vi").textContent = nB;
  document.getElementById("pad-mi").title = "Pad – " + nA;
  document.getElementById("pad-vi").title = "Pad – " + nB;
  document.getElementById("stig-mi").title = "Štiglje – " + nA;
  document.getElementById("stig-vi").title = "Štiglje – " + nB;

  // History
  const list = document.getElementById("history-list");
  if (state.rounds.length === 0) {
    list.innerHTML = '<tr><td colspan="5"><div class="empty-msg">Još nema upisanih rundi ♠</div></td></tr>';
    return;
  }
  list.innerHTML = state.rounds.map((r, i) => {
    const clsA = r.padMi ? "r-total pad" : (!r.padVi && r.addA === 0) ? "r-total stiglje" : r.addA > r.addB ? "r-total win" : "r-total lose";
    const clsB = r.padVi ? "r-total pad" : (!r.padMi && r.addB === 0) ? "r-total stiglje" : r.addB > r.addA ? "r-total win" : "r-total lose";
    const valA = r.padMi ? "PAD" : (!r.padVi && r.addA === 0) ? "ŠTIGLJE" : r.addA;
    const valB = r.padVi ? "PAD" : (!r.padMi && r.addB === 0) ? "ŠTIGLJE" : r.addB;
    return `<tr>
      <td>${i+1}.</td>
      <td><span class="${clsA}">${valA}</span></td>
      <td><span class="${clsB}">${valB}</span></td>
      <td style="font-size:13px;color:#ffffff;font-weight:700">${r.igra}</td>
      <td><button class="del-btn" onclick="deleteRound(${i})">✕</button></td>
    </tr>`;
  }).join("");
}

function checkWinner() {
  if (state.totalA >= 1001 || state.totalB >= 1001) {
    const aWins = state.totalA >= state.totalB;
    if (aWins) state.winsA = (state.winsA || 0) + 1;
    else state.winsB = (state.winsB || 0) + 1;
    document.getElementById("winner-name").textContent = (aWins ? state.nameA : state.nameB) + " pobjeđuje! 🎉";
    document.getElementById("winner-score").textContent = state.totalA + " : " + state.totalB;
    document.getElementById("winner-overlay").classList.add("show");
    dbSave(state); render();
  }
}

function newGame() {
  // Keep wins, reset only current game
  state = { ...state, totalA: 0, totalB: 0, rounds: [], pad: { mi: false, vi: false } };
  document.getElementById("winner-overlay").classList.remove("show"); clearSel();
  document.getElementById("igra-input").value = 162;
  document.getElementById("pts-mi").value = "";
  document.getElementById("pts-vi").value = "";
  dbSave(state); render();
}

// ── Dijalog potvrde (zamjena za confirm) ───
let dialogResolve = null;
function askConfirm({ icon, title, text, ok, cancel, showScore }) {
  if (dialogResolve) dialogResolve(false);
  document.getElementById("dialog-icon").textContent = icon;
  document.getElementById("dialog-title").textContent = title;
  document.getElementById("dialog-text").textContent = text;
  document.getElementById("dialog-ok").textContent = ok;
  document.getElementById("dialog-cancel").textContent = cancel;
  document.getElementById("ds-name-mi").textContent = state.nameA;
  document.getElementById("ds-name-vi").textContent = state.nameB;
  document.getElementById("ds-val-mi").textContent = state.totalA;
  document.getElementById("ds-val-vi").textContent = state.totalB;
  document.getElementById("dialog-score").classList.toggle("show", !!showScore);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.getElementById("dialog-overlay").classList.add("show");
  return new Promise(res => { dialogResolve = res; });
}
function closeDialog(result) {
  document.getElementById("dialog-overlay").classList.remove("show");
  const r = dialogResolve; dialogResolve = null;
  if (r) r(result);
}
function dialogOpen() { return dialogResolve !== null; }
document.getElementById("dialog-ok").addEventListener("click", () => closeDialog(true));
document.getElementById("dialog-cancel").addEventListener("click", () => closeDialog(false));
document.getElementById("dialog-overlay").addEventListener("click", e => { if (e.target.id === "dialog-overlay") closeDialog(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && dialogOpen()) closeDialog(false); });

async function confirmReset() {
  if (await askConfirm({ icon: "↺", title: "Resetirati sve?", text: "Briše se trenutna igra i broj pobjeda.", ok: "Resetiraj", cancel: "Odustani", showScore: state.rounds.length > 0 })) {
    state = { nameA: state.nameA, nameB: state.nameB, totalA: 0, totalB: 0, winsA: 0, winsB: 0, rounds: [], pad: { mi: false, vi: false } };
    document.getElementById("winner-overlay").classList.remove("show"); clearSel();
    document.getElementById("igra-input").value = 162;
    document.getElementById("pts-mi").value = "";
    document.getElementById("pts-vi").value = "";
    dbSave(state); render();
  }
}

// ── Name editing ───────────────────────────
document.getElementById("name-mi").addEventListener("change", e => { state.nameA = e.target.value || "Mi"; dbSave(state); render(); });
document.getElementById("name-vi").addEventListener("change", e => { state.nameB = e.target.value || "Vi"; dbSave(state); render(); });

// ── Voice ──────────────────────────────────
let recognition = null, isListening = false;

function processVoice(transcript) {
  const t = transcript.toLowerCase().trim();
  const nA = (state.nameA || "Mi").toLowerCase();
  const nB = (state.nameB || "Vi").toLowerCase();
  function isA(w) { return w === "mi" || w === nA; }
  function isB(w) { return w === "vi" || w === nB; }

  if (t === "potvrdi" || t === "dodaj") { addRound(); return; }
  if (t === "poništi" || t === "briši") { undoRound(); return; }

  // "igra 182" / "igra sto osamdeset dva"
  let mIgra = t.match(/^igra\s+(\d+)$/);
  if (mIgra) {
    const v = parseInt(mIgra[1]);
    if (stigOn() && v < STIG_MIN) showToast("⚠️ Kod štiglje igra je najmanje " + STIG_MIN + "!", 3000);
    else if (VALID_IGRA.includes(v)) { document.getElementById("igra-input").value = v; showToast("🎮 Igra: " + v); }
    else showToast("⚠️ " + v + " nije valjana igra", 3000);
    return;
  }

  // "pad mi" / "pad vi"
  let mPad = t.match(/^pad\s+(\w+)$/);
  if (mPad) {
    const team = mPad[1];
    if (isA(team)) { togglePad("mi"); showToast("🔴 PAD " + state.nameA + (state.pad.mi ? " aktiviran" : " deaktiviran")); return; }
    if (isB(team)) { togglePad("vi"); showToast("🔴 PAD " + state.nameB + (state.pad.vi ? " aktiviran" : " deaktiviran")); return; }
  }

  // "štiglje mi" / "štiglje vi"
  let mStig = t.match(/^štiglj[eaio]\s+([\wčćžšđ]+)$/);
  if (mStig) {
    const team = mStig[1];
    if (isA(team)) { toggleStig("mi"); showToast("🟠 Štiglje " + state.nameA + (stig.mi ? " aktivirano" : " deaktivirano")); return; }
    if (isB(team)) { toggleStig("vi"); showToast("🟠 Štiglje " + state.nameB + (stig.vi ? " aktivirano" : " deaktivirano")); return; }
  }

  // "mi 90" / "mi bodovi 90" / "bodovi mi 90"
  let mPts = t.match(/^([\wčćžšđ]+)\s+(?:bodov[ie]\s+)?(\d+)$/)
          || t.match(/^bodov[ie]\s+([\wčćžšđ]+)\s+(\d+)$/);
  if (mPts) {
    const team = mPts[1].toLowerCase(), val = parseInt(mPts[2]);
    if (isA(team)) { document.getElementById("pts-mi").value = val; onPtsInput("mi"); showToast("✏️ " + state.nameA + " bodovi: " + val); return; }
    if (isB(team)) { document.getElementById("pts-vi").value = val; onPtsInput("vi"); showToast("✏️ " + state.nameB + " bodovi: " + val); return; }
  }

  showToast('❓ Nisam razumio: "' + transcript + '"', 3000);
}

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast("❌ Browser ne podržava glasovni unos", 3000); return;
  }
  if (isListening) { recognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "hr-HR";
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.onstart = () => {
    isListening = true;
    document.getElementById("mic-btn").classList.add("listening");
    document.getElementById("mic-btn").textContent = "🔴 SLUŠAM...";
    showToast("🎤 Slušam...", 60000);
  };
  recognition.onresult = e => processVoice(e.results[e.results.length - 1][0].transcript);
  recognition.onerror = e => { showToast("⚠️ Greška: " + e.error); stopListening(); };
  recognition.onend = () => stopListening();
  recognition.start();
}

function stopListening() {
  isListening = false;
  const btn = document.getElementById("mic-btn");
  if (btn) { btn.classList.remove("listening"); btn.innerHTML = "🎤 GLASOVNI UNOS"; }
}

// ── Wake Lock ──────────────────────────────
let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });
requestWakeLock();

// ── Potvrda izlaska (strelica nazad) ───────
let leaving = false, guardArmed = false;
function hasData() { return state.rounds.length > 0 || (state.winsA || 0) > 0 || (state.winsB || 0) > 0; }
function armBackGuard() {
  if (guardArmed) return;
  guardArmed = true;
  try { history.pushState({ belaGuard: true }, ""); } catch (e) {}
}
// Guard se postavlja na prvi dodir/tipku (browser ignorira unose u povijest bez interakcije korisnika)
["pointerdown", "touchstart", "keydown"].forEach(ev => window.addEventListener(ev, armBackGuard, { capture: true, passive: true }));
function leaveApp() {
  leaving = true;
  history.back();
  // Instalirana aplikacija (PWA) nema prethodnu stranicu — zatvori prozor
  setTimeout(() => { try { window.close(); } catch (e) {} }, 200);
}
window.addEventListener("popstate", async () => {
  if (leaving) return;
  guardArmed = false;
  if (!hasData()) { leaveApp(); return; }
  const out = await askConfirm({
    icon: "🚪", title: "Izaći iz aplikacije?",
    text: "Trenutna igra i rezultat će se izbrisati.",
    ok: "Izađi", cancel: "Ostani u igri", showScore: true
  });
  if (out) leaveApp(); else armBackGuard();
});
// Zatvaranje taba / osvježavanje stranice
window.addEventListener("beforeunload", e => {
  if (leaving || !hasData()) return;
  e.preventDefault();
  e.returnValue = "";
});

// ── Service Worker ─────────────────────────
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// ── Init ───────────────────────────────────
openDB().then(() => dbLoad()).then(saved => {
  if (saved) {
    state = { ...state, ...saved, winsA: 0, winsB: 0, rounds: [], totalA: 0, totalB: 0, pad: { mi: false, vi: false } };
  }
  render();
}).catch(() => render());
</script>
